spring:
  application:
    name: kortex
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads

  # ── Config Client ────────────────────────────────────────────────────────────
  config:
    import: "optional:configserver:http://config-server:8888"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: true

# ── Actuator + Prometheus ────────────────────────────────────────────────────
# Prometheus scrapes this service via:
#   gateway:8080/kortex/actuator/prometheus  →  lb://kortex/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: kortex
