spring:
  application:
    name: kortex
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads

  config:
    import: "optional:configserver:http://config-server:8888"
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

server:
  port: 0
  tomcat:
    threads:
      max: 2000
      min-spare: 100
    connection-timeout: 60000      # основной таймаут соединения (мс)
    keep-alive-timeout: 60000      # таймаут для keep-alive
    max-connections: 20000
    accept-count: 500

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: true
    appname: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: kortex
