spring:
  application:
    name: gateway
  config:
    import: optional:configserver:http://config-server:8888

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: backend-route
              uri: lb://KORTEX
              predicates:
                - Path=/api/**
            - id: kortex-actuator
              uri: lb://KORTEX
              predicates:
                - Path=/kortex/actuator/**
              filters:
                - StripPrefix=1
              metadata:
                connect-timeout: 60000
                response-timeout: 60s

server:
  tomcat:
    threads:
      max: 10000
      min-spare: 100
    accept-count: 500
    max-connections: 20000
    connection-timeout: 60000        # таймаут входящих соединений (мс)
    keep-alive-timeout: 60000