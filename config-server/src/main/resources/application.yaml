spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          # ── Point this at your own config git repo ──────────────────────────
          # Local filesystem example (good for dev):
          #   uri: file://${user.home}/config-repo
          # Remote Git example:
          uri: https://github.com/dima9997038/KortexVTreadsKotlin
          # Branch to read from
          default-label: master
          # Clone on start so the first request is fast
          clone-on-start: true
          # How long (seconds) to cache properties before re-fetching from git
          refresh-rate: 30

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  instance:
    prefer-ip-address: true

# ── Actuator + Prometheus ────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: config-server
